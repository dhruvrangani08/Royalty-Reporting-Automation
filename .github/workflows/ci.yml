name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build / lint / test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Proves the CLI starts and fails loudly with no secrets present, rather
      # than starting up half-configured.
      - name: Startup must fail closed without secrets
        run: |
          set +e
          APP_ENV=dev node dist/cli/main.js config:check > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          if [ "$code" -eq 0 ]; then
            echo "::error::config:check succeeded with no secrets configured"
            exit 1
          fi
          grep -q "Missing" out.txt || { echo "::error::expected a missing-secrets error"; exit 1; }

  secret-scan:
    name: secret scan (working tree + full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the acceptance criterion covers history, not just HEAD.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks detect --config .gitleaks.toml --redact --verbose --no-banner

      - name: Scan working tree
        run: gitleaks detect --config .gitleaks.toml --no-git --redact --verbose --no-banner
